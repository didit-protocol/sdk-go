name: Feature request
description: Suggest an improvement to the Go SDK.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        The Didit server SDKs keep feature parity across languages (docs/DESIGN.md), so a
        new capability may need to land in all seven SDKs.
