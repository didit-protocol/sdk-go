# NOTHING MAY BE RELEASED before Alex's explicit approval and the 2026-11-01 Didit release
# (docs/DESIGN.md section 13). The `release` environment used by release.yml must require
# a reviewer.
#
# release-please opens the release pull request (version bump in
# internal/version/version.go and the generated CHANGELOG.md) and, once that pull request
# is merged and this workflow runs again, pushes the vX.Y.Z tag and creates the GitHub
# release, which starts release.yml. For a Go module the tag is the release: proxy.golang.org
# and pkg.go.dev serve it once the repository is public. It runs only when started by hand.
#
# Token: a release created with the default GITHUB_TOKEN does not trigger other workflows,
# so release.yml would not start and the release pull request would get no CI. Add a
# repository secret RELEASE_PLEASE_TOKEN (a fine-grained token with Contents, Issues and
# Pull requests read and write on this repository only); without it the workflow falls
# back to GITHUB_TOKEN.
name: Release Please

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
