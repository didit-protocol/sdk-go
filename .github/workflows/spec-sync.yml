# Spec sync (docs/DESIGN.md section 3.1).
#
# Downloads the upstream OpenAPI documents into openapi/ (go run ./codegen sync). When they
# changed, it regenerates the SDK, runs go vet and the tests, and opens (or updates) one pull
# request titled "<type>(spec): sync API spec YYYY-MM-DD" from the branch chore/spec-sync,
# with the sync summary (breaking changes first, then added, removed, renamed, moved and
# changed operations and schemas) as its body.
#
# Type and release (docs/DESIGN.md sections 3.1 and 13): feat when the sync changes anything
# a caller can observe, a minor release even when it can break typed code; chore when only
# documentation changed, which releases nothing on its own. Never "!" and never a
# "BREAKING CHANGE:" footer. The body ends with a BEGIN_COMMIT_OVERRIDE block that
# release-please reads instead of the commits: the feat or chore line, and one "api(spec):"
# line per breaking change, which release-please-config.json lists under "API changes that
# can break typed code". Merge with "Squash and merge": after a merge commit release-please
# reads the block once per commit and lists every line twice.
#
# A check that fails (for example a new operation without SDK naming, which the generator
# reports by name) still opens the pull request, as a draft with the error in its Checks
# section, so the fix (usually an openapi/overlay.json entry) can be pushed to the same
# branch; the run then fails.
#
# Token: pull requests opened with the default GITHUB_TOKEN do not trigger CI (GitHub does
# not start workflows from events caused by GITHUB_TOKEN). To get CI on the sync pull
# request, add a repository secret SPEC_SYNC_TOKEN (a fine-grained token with Contents and
# Pull requests read and write on this repository only). Without it the workflow falls
# back to GITHUB_TOKEN, which needs "Allow GitHub Actions to create and approve pull
# requests" in the repository settings; then close and reopen the pull request, or push to
# its branch, to start CI.
#
# Hand-pushed fixes: every run rebuilds chore/spec-sync from the default branch, which would
# drop a fix pushed to that branch by hand. While the open spec sync pull request carries a
# commit that did not come from this workflow, the run leaves it alone; once that pull
# request is merged or closed, the next run syncs whatever changed since. The push is a
# --force-with-lease against the branch head the run saw when it started, so a commit
# pushed while the run works is never overwritten: the push fails, and the next run sees
# the commit.
name: Spec sync

on:
  schedule:
    - cron: "23 6 * * *" # daily, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    name: Sync the API spec
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      SYNC_BRANCH: chore/spec-sync
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Prepare
        # The summary and the release block live outside the checkout so that they are never
        # committed.
        run: |
          echo "SUMMARY=$RUNNER_TEMP/spec-sync-summary.md" >> "$GITHUB_ENV"
          echo "RELEASE=$RUNNER_TEMP/spec-sync-release.md" >> "$GITHUB_ENV"
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push step authenticates on its own; later steps (go test) get no token.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # standard library only: there is no go.sum to key a cache on
      - name: Leave hand-pushed fixes on the sync branch alone
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          # The branch head now (empty when the branch does not exist): the push below only
          # replaces this commit.
          head="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${SYNC_BRANCH}" \
            --jq ".[] | select(.ref == \"refs/heads/${SYNC_BRANCH}\") | .object.sha")"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base "$BASE" \
            --state open --json number --jq 'length')"
          if [ "$open" = "0" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT" # no open sync pull request
            exit 0
          fi
          authors="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${SYNC_BRANCH}" \
            --jq '.commits[].commit.author.email')"
          if printf '%s\n' "$authors" | grep -v -x -F -e "$BOT_EMAIL" -e '' | grep -q .; then
            echo "::warning::$SYNC_BRANCH has commits that did not come from the spec sync (a fix pushed by hand). This run leaves the branch alone: merge or close the spec sync pull request, and the next run syncs whatever changed since."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the upstream OpenAPI documents
        id: sync
        if: steps.guard.outputs.skip != 'true'
        # Refuses (and writes nothing) when a download is not an OpenAPI 3 document. Writes
        # changed=true|false, date=YYYY-MM-DD, type=feat|chore and breaking=<count> to
        # $GITHUB_OUTPUT, the Markdown summary to $SUMMARY and the release block to $RELEASE.
        run: go run ./codegen sync -summary "$SUMMARY" -release "$RELEASE"
      - name: Regenerate the SDK and run the checks
        id: checks
        if: steps.sync.outputs.changed == 'true'
        run: |
          failed=false
          {
            echo
            echo "## Checks"
            echo
          } >> "$SUMMARY"
          # run_check NAME COMMAND...: runs COMMAND, records the result in the summary and,
          # on failure, the end of its output there and as an error annotation.
          run_check() {
            name="$1"
            shift
            log="$RUNNER_TEMP/check.log"
            echo "::group::$name"
            if "$@" 2>&1 | tee "$log"; then
              echo "- [x] $name" >> "$SUMMARY"
            else
              {
                echo "- [ ] $name: **failed**"
                echo
                echo '  ```text'
                tail -n 60 "$log" | sed 's/^/  /'
                echo '  ```'
              } >> "$SUMMARY"
              message="$(tail -n 20 "$log")"
              message="${message//'%'/'%25'}"
              message="${message//$'\r'/'%0D'}"
              message="${message//$'\n'/'%0A'}"
              echo "::error title=$name failed::$message"
              failed=true
            fi
            echo "::endgroup::"
          }
          # A new operation without SDK naming fails here, naming the operation.
          run_check "Regenerate (go run ./codegen)" go run ./codegen
          run_check "go vet ./..." go vet ./...
          run_check "go test -race ./..." go test -race ./...
          {
            echo
            echo "Opened by [spec sync run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo "Generated code comes from codegen/ and openapi/; do not edit it by hand."
          } >> "$SUMMARY"
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Open or update the spec sync pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
          SYNC_DATE: ${{ steps.sync.outputs.date }}
          SYNC_TYPE: ${{ steps.sync.outputs.type }}
          CHECKS_FAILED: ${{ steps.checks.outputs.failed }}
          LEASE: ${{ steps.guard.outputs.head }}
        run: |
          case "$SYNC_TYPE" in
            feat | chore) ;;
            *) echo "::error::The sync reported type '$SYNC_TYPE', want feat or chore."; exit 1 ;;
          esac
          title="${SYNC_TYPE}(spec): sync API spec ${SYNC_DATE}"
          # GitHub refuses a pull request body of more than 65536 characters. The release block
          # at the end is kept whole; a large sync cuts the operations and schemas listing (the
          # full text is in the job summary) and keeps the breaking changes at the top and the
          # Checks section, which says whether the generated SDK builds.
          body="$RUNNER_TEMP/spec-sync-body.md"
          perl -CSD -e '
            local $/;
            $s = <STDIN>;
            open(my $f, "<:encoding(UTF-8)", $ENV{RELEASE}) or die "$ENV{RELEASE}: $!";
            $r = <$f> // "";
            $max = 65000 - length($r);
            if (length($s) > $max) {
              $i = rindex($s, "\n## Checks\n");
              $tail = $i >= 0 ? substr($s, $i) : "";
              $head = $i >= 0 ? substr($s, 0, $i) : $s;
              $note = "\n**The summary is cut here: it has " . length($s) . " characters, more than fit. The full summary is in the job summary of the spec sync run.**\n";
              $room = $max - length($tail) - length($note) - 1;
              $room = 0 if $room < 0;
              $c = rindex($head, "\n", $room);
              $c = $room if $c <= 0;
              $s = substr($head, 0, $c) . "\n" . $note . $tail;
            }
            print $s . "\n" . $r;
          ' < "$SUMMARY" > "$body"
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git checkout -B "$SYNC_BRANCH"
          # Only the spec copies and the generated layer; nothing else is committed.
          git add -A -- openapi ':(glob)*_gen.go' ':(glob)*_gen_test.go'
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit --quiet -m "$title"
          gh auth setup-git
          # Refused when the branch moved since the guard step read it (or appeared, when it
          # did not exist then).
          git push --force-with-lease="refs/heads/$SYNC_BRANCH:$LEASE" origin "HEAD:refs/heads/$SYNC_BRANCH"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base "$BASE" \
            --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            draft=()
            if [ "$CHECKS_FAILED" = "true" ]; then
              draft=(--draft)
            fi
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$SYNC_BRANCH" \
              --title "$title" --body-file "$body" "${draft[@]}"
            exit 0
          fi
          gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          is_draft="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$CHECKS_FAILED" = "true" ] && [ "$is_draft" = "false" ]; then
            gh pr ready "$number" --repo "$GITHUB_REPOSITORY" --undo
          elif [ "$CHECKS_FAILED" != "true" ] && [ "$is_draft" = "true" ]; then
            gh pr ready "$number" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Fail the run when a check failed
        if: steps.checks.outputs.failed == 'true'
        run: |
          echo "::error::The spec sync pull request was opened, but at least one check failed. See the Checks section of the pull request."
          exit 1
