# Runs when release-please publishes a GitHub release (vX.Y.Z tag), after a reviewer of the
# `release` environment approved that release-please run. NOTHING MAY BE RELEASED before
# Alex's explicit approval and the 2026-11-01 Didit release (docs/DESIGN.md section 13).
#
# A Go module has no registry upload: the tag is the release. This workflow checks the
# tagged code, attaches a source archive with a signed build provenance attestation (SLSA,
# via GitHub artifact attestations), and asks proxy.golang.org to fetch the version so that
# `go get github.com/didit-protocol/sdk-go@vX.Y.Z` and pkg.go.dev see it at once. The proxy
# step only works once the repository is public.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v1.2.0); release-please starts this run
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-and-attest:
    name: Verify, attest and announce to the Go proxy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # upload the archive to the release
      id-token: write # sign the attestation
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: Check the tag matches the SDK version
        run: |
          version="$(sed -n 's/^const Version = "\(.*\)".*/\1/p' internal/version/version.go)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match internal/version.Version ${version}"; exit 1
          fi
      - name: Test the tagged code
        run: |
          go run ./codegen -check
          go vet ./...
          go test -race ./...
      - name: Build the source archive
        run: |
          git archive --format=tar.gz --prefix="sdk-go-${TAG}/" -o "sdk-go-${TAG}.tar.gz" HEAD
          sha256sum "sdk-go-${TAG}.tar.gz" > "sdk-go-${TAG}.tar.gz.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sdk-go-${{ github.event.release.tag_name || inputs.tag }}.tar.gz
      - name: Upload the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" "sdk-go-${TAG}.tar.gz" "sdk-go-${TAG}.tar.gz.sha256" --clobber
      - name: Ask proxy.golang.org to fetch the version
        run: GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "github.com/didit-protocol/sdk-go@${TAG}"
