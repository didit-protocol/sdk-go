version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: gomod
    directories:
      - /
      - /examples
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
