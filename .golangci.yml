# golangci-lint v2 configuration, used by the lint job in .github/workflows/ci.yml.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - nolintlint
    - unconvert
  exclusions:
    # Generated files (the "Code generated ... DO NOT EDIT." header) are skipped;
    # the generator's output is checked by go vet and staticcheck instead.
    generated: lax

formatters:
  enable:
    - gofmt

run:
  timeout: 10m
