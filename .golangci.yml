# golangci-lint v2 configuration, used by the lint job in .github/workflows/ci.yml.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    misspell:
      locale: US
      ignore-rules:
        - honour
        - honouring
        - serialise
        - serialised
        - synthesised
        - normalises
        - initialise
  exclusions:
    # Generated files (the "Code generated ... DO NOT EDIT." header) are skipped.
    generated: lax

formatters:
  enable:
    - gofmt

run:
  timeout: 10m
